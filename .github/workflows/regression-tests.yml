name: Data chatbot regression tests

on:
  push:
    branches: ["main", "stabilize/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m py_compile app.py ai_engine.py data_analyzer.py data_profiler.py dataset_understanding.py insight_generator.py question_router.py visualization_engine.py
      - name: Run dataset-agnostic tests
        run: python -m unittest tests.test_data_agnostic_core -v
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
